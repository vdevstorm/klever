<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; style-src 'unsafe-inline'; img-src data: https://i.ytimg.com https://*.ggpht.com; connect-src https://www.youtube.com https://*.youtube.com https://*.googlevideo.com; media-src https://*.googlevideo.com">
  <title>VeyPlay YouTube Player</title>
  <style>
    html, body, #player { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    (() => {
      "use strict";

      const scope = "veyplay-youtube-player";
      const query = new URLSearchParams(window.location.search);
      let currentVideoId = query.get("videoId") || "";
      const autoplay = query.get("autoplay") === "1";
      let loopPlayback = query.get("loop") === "1";
      const startSeconds = Math.max(0, Number(query.get("start")) || 0);
      let desiredSpeed = Math.max(0.25, Math.min(2, Number(query.get("speed")) || 1));
      const isAndroidClient = /\bAndroid\b/i.test(navigator.userAgent || "");
      let clientReferrer = normalizeClientReferrer(query.get("clientReferrer"))
        || (isAndroidClient ? "https://com.erppal.veyplay" : "");
      let player;
      let stateTimer;
      let apiTimeout;
      let readyTimeout;

      function isValidVideoId(value) {
        return /^[A-Za-z0-9_-]{6,20}$/.test(value);
      }

      function normalizeClientReferrer(value) {
        if (!value) return "";
        try {
          const url = new URL(String(value));
          if (url.protocol !== "https:" || url.username || url.password) return "";
          return url.origin;
        } catch (_) {
          return "";
        }
      }

      function send(payload) {
        window.parent.postMessage({ scope, ...payload }, "*");
      }

      if (!isValidVideoId(currentVideoId)) {
        send({
          type: "state",
          state: -1,
          position: 0,
          duration: 0,
          videoId: currentVideoId,
          error: { code: "bridge-invalid-video-id", phase: "validation", message: "Mã video YouTube không hợp lệ." }
        });
        return;
      }

      function clearApiTimeout() {
        if (apiTimeout) window.clearTimeout(apiTimeout);
        apiTimeout = undefined;
      }

      function clearWatchdogs() {
        clearApiTimeout();
        if (readyTimeout) window.clearTimeout(readyTimeout);
        apiTimeout = undefined;
        readyTimeout = undefined;
      }

      function createError(code, phase) {
        const messages = {
          "2": "Yêu cầu phát YouTube không hợp lệ.",
          "5": "Trình phát YouTube không thể tải nội dung này.",
          "100": "Video YouTube này không còn khả dụng.",
          "101": "Chủ sở hữu không cho phép phát video này trong trình phát nhúng.",
          "150": "Chủ sở hữu không cho phép phát video này trong trình phát nhúng.",
          "153": "YouTube không nhận được định danh ứng dụng hợp lệ cho trình phát nhúng.",
          "bridge-api-timeout": "Trình phát YouTube không phản hồi kịp thời.",
          "bridge-api-load": "Không thể tải trình phát YouTube.",
          "bridge-onready-timeout": "Trình phát YouTube không sẵn sàng kịp thời."
        };
        return { code: String(code), phase, message: messages[String(code)] || "YouTube không thể phát video này." };
      }

      function resolvePlayerVideoId(target) {
        try {
          const data = target && typeof target.getVideoData === "function"
            ? target.getVideoData()
            : null;
          const actualVideoId = String(data && data.video_id || "");
          return isValidVideoId(actualVideoId) ? actualVideoId : currentVideoId;
        } catch (_) {
          return currentVideoId;
        }
      }

      function publish(error, target) {
        send({
          type: "state",
          state: player && typeof player.getPlayerState === "function" ? player.getPlayerState() : -1,
          position: player && player.getCurrentTime ? player.getCurrentTime() : 0,
          duration: player && player.getDuration ? player.getDuration() : 0,
          videoId: resolvePlayerVideoId(target || player),
          error: error || null
        });
      }

      function applyDesiredSpeed() {
        if (player && typeof player.setPlaybackRate === "function") {
          player.setPlaybackRate(desiredSpeed);
        }
      }

      function canReuseHealthyAndroidVideo(nextVideoId) {
        if (!isAndroidClient || !clientReferrer || !player) return false;
        const actualVideoId = resolvePlayerVideoId(player);
        const state = typeof player.getPlayerState === "function"
          ? player.getPlayerState()
          : -1;
        return actualVideoId === nextVideoId
          && (state === 1 || state === 2 || state === 3 || state === 5);
      }

      function reuseHealthyAndroidVideo(nextStart, autoPlay) {
        const currentPosition = player && typeof player.getCurrentTime === "function"
          ? player.getCurrentTime()
          : 0;
        if (Math.abs(currentPosition - nextStart) > 1.5
            && typeof player.seekTo === "function") {
          player.seekTo(nextStart, true);
        }
        applyDesiredSpeed();
        if (autoPlay && typeof player.playVideo === "function") player.playVideo();
        else if (!autoPlay && typeof player.pauseVideo === "function") player.pauseVideo();
      }

      function loadVideo(value) {
        const nextVideoId = String(value && value.videoId || "");
        if (!player || !isValidVideoId(nextVideoId)) return;

        const nextStart = Math.max(0, Number(value.start) || 0);
        desiredSpeed = Math.max(0.25, Math.min(2, Number(value.speed) || 1));
        loopPlayback = Boolean(value.loop);
        clientReferrer = normalizeClientReferrer(value.clientReferrer) || clientReferrer;
        if (canReuseHealthyAndroidVideo(nextVideoId)) {
          // Android giữ một YT.Player giữa các lần Next. Khi Razor chỉ đổi load
          // revision trước khi video đích đổi, bridge cũ từng load lại chính video
          // đang phát và tạo thêm decoder. Giữ nguyên player khỏe mạnh để lần load
          // video đích kế tiếp tiếp quản mà không tạo callback/decoder thừa.
          currentVideoId = nextVideoId;
          reuseHealthyAndroidVideo(nextStart, Boolean(value.autoplay));
          return;
        }

        currentVideoId = nextVideoId;
        send({
          type: "state",
          state: 3,
          position: nextStart,
          duration: 0,
          videoId: currentVideoId,
          error: null
        });

        const request = { videoId: currentVideoId, startSeconds: nextStart };
        if (value.autoplay) player.loadVideoById(request);
        else player.cueVideoById(request);
        applyDesiredSpeed();
      }

      window.onYouTubeIframeAPIReady = () => {
        clearApiTimeout();
        const events = {
            onReady: event => {
              clearWatchdogs();
              if (startSeconds > 0) event.target.seekTo(startSeconds, true);
              applyDesiredSpeed();
              if (autoplay) event.target.playVideo();
              const rates = event.target.getAvailablePlaybackRates
                ? event.target.getAvailablePlaybackRates()
                : [];
              send({ type: "capabilities", videoId: currentVideoId, playbackRates: rates, canSeek: true, canMute: true });
              publish();
              stateTimer = window.setInterval(() => publish(), 1000);
            },
            onStateChange: event => {
              if (event.data === 0 && loopPlayback) {
                event.target.seekTo(0, true);
                event.target.playVideo();
                return;
              }
              if (event.data === 1 || event.data === 5) applyDesiredSpeed();
              publish(null, event.target);
            },
            onError: event => {
              clearWatchdogs();
              publish(createError(event.data, "player"), event.target);
            }
        };

        if (clientReferrer) {
          // Android WebView cần widget_referrer là định danh HTTPS ổn định của
          // ứng dụng. Tạo iframe trước để IFrame API không ghi đè tham số này.
          const playerUrl = new URL(`https://www.youtube.com/embed/${encodeURIComponent(currentVideoId)}`);
          playerUrl.searchParams.set("playsinline", "1");
          playerUrl.searchParams.set("rel", "0");
          playerUrl.searchParams.set("controls", "1");
          playerUrl.searchParams.set("fs", "1");
          playerUrl.searchParams.set("enablejsapi", "1");
          playerUrl.searchParams.set("origin", window.location.origin);
          playerUrl.searchParams.set("widget_referrer", clientReferrer);

          const playerFrame = document.createElement("iframe");
          playerFrame.id = "youtube-player-frame";
          playerFrame.src = playerUrl.toString();
          playerFrame.referrerPolicy = "strict-origin-when-cross-origin";
          playerFrame.allow = "autoplay; encrypted-media; fullscreen";
          playerFrame.allowFullscreen = true;
          playerFrame.setAttribute("frameborder", "0");
          playerFrame.style.width = "100%";
          playerFrame.style.height = "100%";
          playerFrame.style.display = "block";
          document.getElementById("player").replaceChildren(playerFrame);
          player = new YT.Player("youtube-player-frame", { events });
        } else {
          // Giữ nguyên đường IFrame API cũ cho iOS và các client không truyền
          // Android referrer để hotfix Android không thay đổi hành vi iOS.
          player = new YT.Player("player", {
            width: "100%",
            height: "100%",
            videoId: currentVideoId,
            playerVars: {
              playsinline: 1,
              rel: 0,
              controls: 1,
              fs: 1,
              enablejsapi: 1,
              origin: window.location.origin,
              widget_referrer: window.location.href
            },
            events
          });
        }
        readyTimeout = window.setTimeout(() => {
          publish(createError("bridge-onready-timeout", "player-ready"));
        }, 11000);
      };

      window.addEventListener("message", event => {
        const message = event.data;
        if (event.source !== window.parent || !message || message.scope !== scope || !player) return;

        switch (message.command) {
          case "load": loadVideo(message.value); break;
          case "play": player.playVideo(); break;
          case "pause": player.pauseVideo(); break;
          case "stop": player.stopVideo(); break;
          case "seek": player.seekTo(Math.max(0, Number(message.value) || 0), true); break;
          case "speed":
            desiredSpeed = Math.max(0.25, Math.min(2, Number(message.value) || 1));
            applyDesiredSpeed();
            break;
          case "mute": message.value ? player.mute() : player.unMute(); break;
          case "volume": player.setVolume(Math.max(0, Math.min(100, Number(message.value) || 0))); break;
          case "destroy":
            if (stateTimer) window.clearInterval(stateTimer);
            clearWatchdogs();
            player.destroy();
            player = null;
            break;
        }
      });

      function pauseForBackground() {
        if (!player || typeof player.pauseVideo !== "function") return;
        player.pauseVideo();
        publish();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) pauseForBackground();
      });
      window.addEventListener("pagehide", pauseForBackground);

      const api = document.createElement("script");
      api.src = "https://www.youtube.com/iframe_api";
      api.async = true;
      api.onerror = () => {
        clearApiTimeout();
        publish(createError("bridge-api-load", "api-load"));
      };
      document.head.appendChild(api);
      apiTimeout = window.setTimeout(() => {
        publish(createError("bridge-api-timeout", "api-load"));
      }, 11000);
    })();
  </script>
</body>
</html>
